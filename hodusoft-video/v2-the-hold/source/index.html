.pill{display:inline-flex;align-items:center;gap:10px;border-radius:999px;font-family:Mono;white-space:nowrap}

// grain + vignette

{const g=gcv.getContext('2d'),im=g.createImageData(256,256);for(let i=0;i<im.data.length;i+=4){const v=Math.random()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}g.putImageData(im,0,0)}
gcv.style.width=(W+200)+'px';gcv.style.height=(H+200)+'px';gcv.style.imageRendering='pixelated';

// timing of headlines

function prep(){HL.forEach(([h,i])=>{const s=h.closest('.scene');s.style.display='block';fit(h);place(h);s.style.display='none';wordTimes(h,L[i],D[i])})}

// ---------------- RENDER ----------------
const show=(s,a,b,t)=>{s.style.display=(t>=a&&t<b)?'block':'none';return t>=a&&t<b};
function render(t){
 // grain jitter
 gcv.style.transform=`translate(${Math.floor(hash(Math.floor(t*30))*100)}px,${Math.floor(hash(Math.floor(t*30)+.5)*100)}px)`;
 const DROP=3.55;
 // ---- S1
 if(show(s1,0,4.25,t)){
  const ty=PORT?cy-80:cy-60;
  const k=cl(t/DROP);const secs=t<DROP?892*(Math.pow(k,2.6)):892;
  timer.textContent=mmss(secs);const dead=t>=DROP;
  timer.style.color=dead?'var(--red)':'var(--ink)';
  const gl=dead?(hash(Math.floor(t*40))-.5)*18*(1-P(t,DROP+.35,.3)):0;
  timer.style.textShadow=dead?`${gl}px 0 rgba(255,59,48,.7),${-gl}px 0 rgba(0,200,255,.5)`:'none';
  T(timer,cx+gl,ty,1*(1+.03*P(t,DROP,.08)*(1-P(t,DROP+.08,.3))),0,P(t,0,.25));
  hold.querySelector('.lab').textContent=dead?'CALL DROPPED':'ON HOLD';hold.style.color=dead?'var(--red)':'#BDBDC4';
  hold.querySelector('.dot').style.opacity=dead?1:(Math.sin(t*6)>0?1:.2);
  T(hold,cx,ty-(PORT?220:230),1,0,P(t,.05,.3));
  // hold waveform
  const ww=PORT?900:1200;let d='';const amp=dead?0:(38+14*Math.sin(t*3));
  for(let x=0;x<=ww;x+=6){const y=110+amp*Math.sin(x*.035+t*9)*Math.sin(x*.004+t*1.3)*(1-Math.pow(Math.abs(x-ww/2)/(ww/2),2));d+=(x?'L':'M')+x+' '+y.toFixed(1)}
  wpath.setAttribute('d',d);wpath.setAttribute('stroke',dead?'#FF3B30':'#C6FF3D');T(wave,cx,ty+(PORT?230:220),1,0,P(t,.1,.4));
  // IVR caption synced to voice (starts TM.ivr)
  const spans=cap1.children;for(let i=0;i<spans.length;i++){const wt=TM.ivr+i*(2.95/IVRW.length);spans[i].style.opacity=t>wt?1:.18}
  T(cap1,cx,ty+(PORT?460:420),1,0,P(t,.2,.3)*(dead?.35:1));
  T(caller,cx,ty+(PORT?600:.0)+(PORT?0:520),1,0,P(t,1.2,.3)*(dead?0:1));
 }
 red1.style.display=(t>=DROP&&t<DROP+.12)?'block':'none';
 // ---- S2a
 if(show(s2a,L[0]-.05,L[1]-.02,t)){animHL(h2a,t,L[1]-.2);
  dots.forEach(d=>{d.style.transform='none';d.style.opacity=1;d.style.background='var(--lime)'});
  let n=0;drops.forEach((idx,j)=>{const tj=L[0]+.25+j*(D[0]-.1)/drops.length;const d=dots[idx];if(t>tj){n++;const k=P(t,tj,.5,'in3');d.style.background='var(--red)';d.style.transform=`translateY(${k*260}px) scale(${1-k*.5})`;d.style.opacity=1-k}});
  abd.querySelector('.n').textContent=n;
  v2a.style.opacity=P(t,L[0],.3);
 }
 // ---- S2b
 if(show(s2b,L[1]-.05,L[2]-.02,t)){animHL(h2b,t,L[2]-.2);
  const cyc=Math.max(0,Math.floor((t-L[1])/.22));let top=0;
  wins.forEach((w,i)=>{const a=P(t,L[1]+i*.12,.35,'outBack');const shake=(hash(i+cyc*7)-.5)*14;
   w.style.transform=`translate(${w._x-250+shake}px,${w._y-165}px) rotate(${w._r}deg) scale(${a})`;w.style.opacity=a>0?1:0;
   const foc=(cyc%6)==i&&t>L[1]+.7;w.style.zIndex=foc?20:i;w.style.borderColor=foc?'#C6FF3D':'#2A2A30'});
  const fi=wins[(cyc%6)];const cxp=fi._x+60,cyp=fi._y-120;const pk=((t-L[1])%.22)/.22;
  cursor.style.transform=`translate(${cxp+(1-E.outExpo(pk))*80}px,${cyp+(1-E.outExpo(pk))*40}px)`;cursor.style.opacity=t>L[1]+.7?1:0;
  tabs.innerHTML=`ALT+TAB × <span style="color:var(--red)">${Math.max(0,cyc-2)}</span>`;
 }
 // ---- S2c
 if(show(s2c,L[2]-.05,L[3]-.25,t)){animHL(h2c,t,L[3]-.45);
  tiles.forEach((tl,i)=>{const a=P(t,L[2]+i*.05,.3);tl.style.opacity=a;
   const off=t>L[2]+.9+i*.11;const g=tl._cv;
   if(!off){const im=g.createImageData(140,125);for(let p=0;p<im.data.length;p+=4){const v=Math.random()*200;im.data[p]=im.data[p+1]=im.data[p+2]=v;im.data[p+3]=255}g.putImageData(im,0,0)}else{g.fillStyle='#08080A';g.fillRect(0,0,140,125)}
   tl.querySelector('.ns').style.opacity=off?(Math.sin(t*14+i)>-.3?1:0):0;tl.style.borderColor=off?'#3a1414':'#2A2A30'});
 }
 // ---- S3 brand
 const B0=L[3]-.2,B1=L[4]-.12;
 if(show(s3,B0,B1,t)){
  const ey=PORT?cy+300:cy+250;const k=cl((t-B0)/1.3);let d='';
  for(let x=0;x<=W;x+=4){const px=x/W;const head=k*1.25;let y=200;const dd=px-head+.15;
   if(px<head){if(Math.abs(dd)<.05){const u=dd/.05;y=200-Math.exp(-u*u*6)*170*Math.cos(u*3)}else y=200+Math.sin(x*.02)*2}
   d+=(x?'L':'M')+x+' '+y.toFixed(1)}
  ecgp.setAttribute('d',d);T(ecg,cx,ey);
  T(meet,cx,(PORT?cy-260:cy-250)+(1-P(t,B0+.1,.4,'outExpo'))*30,1,0,P(t,B0+.1,.3));
  const b=P(t,B0+.18,.5,'outExpo');T(brand,cx,PORT?cy-80:cy-70,mix(1.25,1,b),0,b);
  T(by,cx,PORT?cy+110:cy+110,1,0,P(t,B0+.55,.4));
 }
 // tag + chip
 const tagOn=t>=B1&&t<L[8]-.1;
 T(tag,PORT?80+180:110+170,PORT?100:80,1,0,tagOn?P(t,B1,.3):0);
 const CH=[[L[4],'01 — SMART IVR + ROUTING'],[L[5],'02 — PREDICTIVE DIALER'],[L[6],'03 — OMNICHANNEL'],[L[7],'04 — LIVE CALL MONITORING']];
 let ci=-1;CH.forEach((c,i)=>{if(t>=c[0]-.12)ci=i});
 if(tagOn&&ci>=0){chip.textContent=CH[ci][1];const a=P(t,CH[ci][0]-.12,.3,'outExpo');chip.style.opacity=a;
  const cyy=PORT?LY.hy-60+0:0;chip.style.left=(PORT?LY.hx:LY.hx)+'px';chip.style.top=(PORT?150:140)+'px';chip.style.transform=`translateX(${(1-a)*-40}px)`}else chip.style.opacity=0;
 // ---- F1 IVR
 if(show(f1,L[4]-.12,L[5]-.1,t)){animHL(h4,t,L[5]-.3);const s=L[4];
  const segs=[['p0',s+.1],['pB',s+.75],['pD',s+1.45]];
  ['p0','pA','pB','pC','pD'].forEach(id=>{const p=v4.querySelector('#'+id);const len=p.getTotalLength();p.style.strokeDasharray=len;
   let k=0,col='#2A2A30';if(id=='pA'||id=='pC'){k=P(t,s+.55,.4);}
   const sg=segs.find(x=>x[0]==id);if(sg){k=P(t,sg[1],.55,'inOut');col='#C6FF3D'}
   p.style.strokeDashoffset=len*(1-k);p.setAttribute('stroke',col)});
  const on=(c,tt)=>{const n=v4.querySelector(c);const lit=t>tt;n.style.borderColor=lit?'#C6FF3D':'#2A2A30';n.style.color=lit?'#C6FF3D':'#A9A9B0'};
  on('.n0',s);on('.n1',s+.62);on('.nB',s+1.3);
  ['.nA','.nC'].forEach(c=>v4.querySelector(c).style.opacity=t>s+1.3?.35:1);
  // pulse along path
  let pp=null;for(const [id,st] of segs){const k=cl((t-st)/.55);if(t>=st&&k<1){const p=v4.querySelector('#'+id);pp=p.getPointAtLength(E.inOut(k)*p.getTotalLength())}}
  pulse.style.opacity=pp?1:0;if(pp)pulse.style.transform=`translate(${pp.x-17}px,${pp.y-17}px)`;
  const ag=v4.querySelector('.agent');const a=P(t,s+1.95,.45,'outBack');ag.style.transform=`scale(${a})`;ag.style.opacity=a>0?1:0;
  ag.querySelector('.tm').textContent=mmss(Math.max(0,(t-s-2.1)*1.5));
  v4.style.opacity=P(t,s-.1,.25);
 }
 // ---- F2 dialer
 if(show(f2,L[5]-.1,L[6]-.1,t)){animHL(h5,t,L[6]-.3);const s=L[5];
  rows5.forEach((r,i)=>{const a=P(t,s+i*.06,.35,'outExpo');r.style.opacity=a;r.style.transform=`translateX(${(1-a)*60}px)`;
   const tc=s+.5+i*.28;const talking=t>tc;const f=r.querySelector('.fill');f.style.width=(talking?Math.min(100,(t-tc)*55+8):0)+'%';
   const st=r.querySelector('.st');st.textContent=talking?'TALKING':'IDLE';st.style.background=talking?'var(--lime)':'transparent';st.style.color=talking?'#0A0A0B':'#8A8A92';st.style.borderColor=talking?'var(--lime)':'#3A3A42'});
  const nums=['+1 212 555 0198','+44 7700 900412','+1 305 555 0170','+61 491 570 156','+971 50 555 0192','+1 718 555 0133','+44 7700 900981','+1 702 555 0168'];
  const k=Math.floor((t-s)/.25);dial.innerHTML=[0,1].map(j=>{const n=k-j;if(n<0)return '';const ok=n%3!=1;return `<div>DIALING ${nums[n%8]} <span style="color:${ok?'var(--lime)':'#55555C'}">${ok?'→ CONNECTED':'× NO ANSWER'}</span></div>`}).join('');
 }
 // ---- F3 omni
 if(show(f3,L[6]-.1,L[7]-.1,t)){animHL(h6,t,L[7]-.3);const s=L[6];
  const m=P(t,s+.15,.6,'inOut');
  wins3.forEach((w,i)=>{const a=P(t,s-.1+i*.03,.25,'outBack');const tx=mix(w._x,450,m),ty=mix(w._y,440,m);
   w.style.transform=`translate(${tx-250}px,${ty-165}px) rotate(${w._r*(1-m)}deg) scale(${a*(1-m*.6)})`;w.style.opacity=(1-P(t,s+.6,.15))});
  const u=P(t,s+.62,.45,'outBack');uni.style.transform=`scale(${.7+.3*u})`;uni.style.opacity=cl(u*1.5);
  const hi=h6._t;const chT=[hi[0],hi[1],hi[2],hi[3]];
  for(let i=0;i<4;i++){const c=uni.querySelector('.ch'+i);const act=t>chT[i]+.1;c.style.background=act?'rgba(198,255,61,.12)':'transparent';c.style.outline=act?'2px solid rgba(198,255,61,.6)':'none'}
  msgs.forEach((mm,i)=>{const tt=i<4?chT[i]+.15:hi[4]+.1;const a=P(t,tt,.35,'outExpo');mm.style.opacity=a;mm.style.transform=`translateY(${(1-a)*30}px)`;
   if(i==4){mm.style.background=t>tt?'var(--lime)':'#1C1C21';mm.style.color='#0A0A0B';mm.firstChild.style.color='#0A0A0B'}});
 }
 // ---- F4 monitor
 if(show(f4,L[7]-.1,L[8]-.12,t)){animHL(h7,t,L[8]-.32);const s=L[7];
  const hi=h7._t;
  tiles4.forEach((tl,i)=>{const a=P(t,s+i*.04,.3);tl.style.opacity=a;let d='';
   for(let x=0;x<=280;x+=8){const y=60+Math.sin(x*.08+t*(8+i))*Math.sin(x*.02+t*2+i)*38*(0.6+.4*Math.sin(t*3+i*2));d+=(x?'L':'M')+x+' '+y.toFixed(1)}
   tl._p.setAttribute('d',d);tl.querySelector('.tt').textContent=mmss(40+i*37+(t-s));
   const sel=i==4&&t>hi[0]-.1;tl.style.borderColor=sel?'#C6FF3D':'#2A2A30';tl.style.boxShadow=sel?'0 0 0 4px rgba(198,255,61,.25)':'none'});
  live.querySelector('.ld').style.opacity=Math.sin(t*8)>0?1:.25;
  ctrls.forEach((c,i)=>{const act=t>hi[i]-.05;const cur=act&&(i==2||t<hi[i+1]-.05);c.style.background=cur?'var(--lime)':'transparent';c.style.color=cur?'#0A0A0B':(act?'#C6FF3D':'#8A8A92');c.style.borderColor=act?'#C6FF3D':'#2A2A30';
   c.style.transform=`scale(${1+.06*P(t,hi[i]-.05,.08)*(1-P(t,hi[i]+.03,.2))})`});
  // supervisor cursor goes tile -> buttons
  const pts=[[450,380],[140,790],[450,790],[760,790]];const kk=[hi[0]-.35,hi[0]-.05,hi[1]-.05,hi[2]-.05];let px=pts[0][0]+200,py=pts[0][1]+200;
  for(let j=0;j<4;j++){const a=P(t,kk[j]-.25,.25,'inOut');const prev=j?pts[j-1]:[650,580];if(t>=kk[j]-.25){px=mix(prev[0],pts[j][0],a);py=mix(prev[1],pts[j][1],a)}}
  sup.style.transform=`translate(${px}px,${py}px)`;sup.style.opacity=P(t,s+.2,.2);
  const bl=t>hi[3]-.05;live.style.color=bl?'var(--red)':'var(--ink)';
 }
 // ---- END
 if(show(s5,L[8]-.12,99,t)){const s=L[8];
  const endT=L[9]+D[9]-.1;const ec=P(t,endT,.6,'inOut');
  const ty=PORT?cy+140:cy+190;
  const rw=P(t,s,1.0,'inOut');timer5.textContent=mmss(892*(1-rw));const conn=rw>=1;
  timer5.style.color=conn?'var(--lime)':'var(--ink)';
  hold5.innerHTML=conn?'<span style="color:var(--lime)">● CONNECTED</span>':'<span style="color:#BDBDC4">◀◀ REWINDING HOLD TIME</span>';
  T(timer5,cx,mix(ty,PORT?cy-560:cy-330,ec),mix(1,.42,ec),0,P(t,s-.1,.2));
  T(hold5,cx,mix(ty-(PORT?200:180),PORT?cy-680:cy-420,ec),mix(1,.8,ec),0,P(t,s-.1,.2)*(1-ec*0.0));
  animHL(h8,t,L[9]-.18);animHL(h9,t,endT-.05);
  h8.style.transform=`translateY(${0}px)`;
  const lg=P(t,endT+.05,.55,'outExpo');T(logo,cx,(PORT?cy-110:cy-120)+(1-lg)*50,1,0,lg);
  T(sub5,cx,PORT?cy+10:cy-10,1,0,P(t,endT+.25,.4));
  const ca=P(t,endT+.35,.5,'outBack');T(cta,cx,PORT?cy+190:cy+140,ca*(1+.025*Math.sin((t-endT)*5)*(t>endT+1)));
  T(url,cx,PORT?cy+330:cy+270,1,0,P(t,endT+.55,.4));
 }
 flash.style.display=(t>=B0&&t<B0+.1)?'block':'none';flash.style.opacity=.85;
}
window.render=render;
window.ready=Promise.all([document.fonts.load('150px Anton'),document.fonts.load('700 30px Inter'),document.fonts.load('30px Mono')]).then(()=>document.fonts.ready).then(()=>{prep();render(0);return true});
