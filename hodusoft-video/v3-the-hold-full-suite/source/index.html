<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Anton;src:url(fonts/anton400.woff2) format('woff2')}
@font-face{font-family:Inter;src:url(fonts/inter700.woff2) format('woff2');font-weight:100 900}
@font-face{font-family:Mono;src:url(fonts/mono.woff2) format('woff2')}
:root{--bg:#0A0A0B;--ink:#F2F0EA;--lime:#F26422;--red:#FF2E55;--dim:#6B6B72;--panel:#141417;--line:#2A2A30}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000;overflow:hidden}
body{font-family:Inter,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#stage{position:relative;overflow:hidden;background:var(--bg)}
.scene{position:absolute;inset:0;display:none}
.a{position:absolute}
.c{position:absolute;left:0;top:0}
.mono{font-family:Mono;letter-spacing:.02em}
.hl{position:absolute;font-family:Anton;text-transform:uppercase;line-height:.96;white-space:nowrap;letter-spacing:.005em}
.hl .ln{display:block;overflow:hidden;padding-top:.04em}
.hl .w{display:inline-block;will-change:transform}
.hl .lime{color:var(--lime)} .hl .red{color:var(--red)}
.vis{position:absolute;width:900px;height:900px;transform-origin:50% 50%}
.win{position:absolute;width:500px;height:330px;background:var(--panel);border:2px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 30px 60px -20px rgba(0,0,0,.8)}
.win .tb{height:46px;border-bottom:2px solid var(--line);display:flex;align-items:center;gap:9px;padding:0 16px;font-family:Mono;font-size:20px;color:#A9A9B0}
.win .tb i{width:12px;height:12px;border-radius:50%;background:#3A3A42;display:block}
.bar{position:absolute;height:14px;border-radius:7px;background:#2A2A31}
.tile{position:absolute;width:280px;height:250px;background:var(--panel);border:2px solid var(--line);border-radius:14px;overflow:hidden}
.tile .k{position:absolute;left:18px;top:14px;font-family:Mono;font-size:19px;color:#8A8A92}
.tile .v{position:absolute;left:18px;bottom:14px;font-family:Anton;font-size:64px}
.chip{position:absolute;font-family:Mono;font-size:24px;color:var(--lime);border:2px solid var(--lime);border-radius:999px;padding:8px 20px;white-space:nowrap}
.node{position:absolute;border:3px solid var(--line);background:var(--panel);border-radius:18px;display:flex;align-items:center;justify-content:center;font-family:Mono;font-size:24px;color:#A9A9B0;text-align:center}
.pill{display:inline-flex;align-items:center;gap:10px;border-radius:999px;font-family:Mono;white-space:nowrap}
#grain{position:absolute;inset:-100px;pointer-events:none;opacity:.07;mix-blend-mode:screen}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.55))}
</style></head>
