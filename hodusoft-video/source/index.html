<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:J;src:url(fonts/jakarta.woff2) format('woff2');font-weight:200 800}
@font-face{font-family:SerifI;src:url(fonts/serif-i.woff2) format('woff2');font-style:normal}
@font-face{font-family:Mono;src:url(fonts/mono.woff2) format('woff2')}
:root{--navy:#0B1B3F;--blue:#2F6BFF;--orange:#FF7A1A;--cream:#F5F2EA;--ink:#0B1B3F;--mut:#6B7280;--green:#16C172;--red:#FF4757}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000;overflow:hidden}
body{font-family:J,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#stage{position:relative;overflow:hidden;background:var(--cream)}
.abs{position:absolute;left:0;top:0}
.c{position:absolute;left:0;top:0;will-change:transform}
.scene{position:absolute;inset:0;display:none}
.bg{position:absolute;inset:0}
.hl{position:absolute;font-weight:800;letter-spacing:-0.045em;line-height:1.0;white-space:nowrap}
.hl .ln{display:block;overflow:hidden;padding:0.06em 0 0.1em}
.hl .w{display:inline-block;will-change:transform}
.hl em{font-family:SerifI;font-style:normal;font-weight:400;letter-spacing:-0.02em;color:var(--orange);font-size:1.14em}
.card{position:absolute;width:840px;height:1000px;background:#fff;border-radius:48px;box-shadow:0 40px 80px -30px rgba(11,27,63,.35),0 0 0 1px rgba(11,27,63,.06);overflow:hidden}
.chip{position:absolute;display:flex;align-items:center;gap:18px;background:#fff;border-radius:999px;padding:16px 30px 16px 16px;box-shadow:0 18px 40px -16px rgba(11,27,63,.35),0 0 0 1px rgba(11,27,63,.06);white-space:nowrap}
.chip .ico{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;flex:none}
.chip b{display:block;font-size:26px;font-weight:800;letter-spacing:-.01em}
.chip span{display:block;font-size:22px;color:var(--mut);font-weight:500;margin-top:2px}
.ico{border-radius:50%;display:grid;place-items:center}
.ico svg{width:58%;height:58%;fill:#fff}
.pill{display:inline-flex;align-items:center;gap:10px;border-radius:999px;font-weight:700}
.row{position:absolute;left:36px;right:36px;height:128px;border-radius:28px;background:#F7F8FB;display:flex;align-items:center;gap:22px;padding:0 26px}
.row .ico{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;flex:none}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:28px;font-weight:800}
.row .tx span{display:block;font-size:24px;color:var(--mut);font-weight:500;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tm{font-size:22px;color:var(--mut);font-weight:600}
.lbl{font-size:24px;font-weight:700;color:var(--mut);letter-spacing:.02em}
.mono{font-family:Mono}
.node{position:absolute;background:#F7F8FB;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800}
.bubble{position:absolute;max-width:560px;padding:24px 30px;border-radius:34px;font-size:30px;font-weight:600;line-height:1.3}
.kpi{position:absolute;background:#F7F8FB;border-radius:30px;padding:26px 28px}
.kpi .k{font-size:22px;font-weight:700;color:var(--mut)}
.kpi .v{font-size:56px;font-weight:800;letter-spacing:-.03em;margin-top:6px}
</style></head>
<body><div id="stage"></div>
<script>
const Q=new URLSearchParams(location.search);
const W=+(Q.get('w')||1080),H=+(Q.get('h')||1920),PORT=H>W;
const MIN=Math.min(W,H);
const stage=document.getElementById('stage');stage.style.width=W+'px';stage.style.height=H+'px';
// ---------- helpers ----------
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const E={lin:x=>x,out3:x=>1-Math.pow(1-x,3),outExpo:x=>x>=1?1:1-Math.pow(2,-10*x),inOut:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
 outBack:x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)},in3:x=>x*x*x,inExpo:x=>x<=0?0:Math.pow(2,10*x-10),
 outElastic:x=>x<=0?0:x>=1?1:Math.pow(2,-10*x)*Math.sin((x*10-.75)*(2*Math.PI)/3)+1};
const P=(t,a,d,e='out3')=>E[e](cl((t-a)/d));
const mix=(a,b,k)=>a+(b-a)*k;
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
function S(el,o){const s=o.s??1;el.style.transform=`translate(${o.x||0}px,${o.y||0}px) translate(-50%,-50%) rotate(${o.r||0}deg) scale(${o.sx??s},${o.sy??s})`;
 if(o.op!==undefined)el.style.opacity=o.op; if(o.blur!==undefined)el.style.filter=o.blur>0.15?`blur(${o.blur.toFixed(2)}px)`:'none';}
function el(tag,cls,html,parent,style){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(style)e.style.cssText=style;(parent||stage).appendChild(e);return e}
const fmt=n=>Math.round(n).toLocaleString('en-US');
const IC={
 phone:'<path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"/>',
 chat:'<path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>',
 mail:'<path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>',
 sms:'<path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM9 11H7V9h2v2zm4 0h-2V9h2v2zm4 0h-2V9h2v2z"/>',
 wa:'<path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5 13.6c-.2.6-1.2 1.2-1.7 1.2-.5.1-1 .2-3.2-.7-2.7-1.1-4.4-3.8-4.5-4-.1-.2-1.1-1.4-1.1-2.7s.7-1.9.9-2.2c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.3 0 .5l-.4.6-.3.3c-.1.2-.3.3-.1.6.1.3.6 1 1.3 1.6.9.8 1.6 1 1.9 1.2.2.1.4.1.5-.1l.8-.9c.2-.2.3-.2.6-.1l1.9.9c.3.1.4.2.5.3.1.2.1.7-.1 1.3z"/>',
 insta:'<path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zm5 5a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6zm5.5-3.5a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4z"/>',
 vm:'<path d="M6.5 7a5 5 0 0 1 3.9 8.1h3.2A5 5 0 1 1 17.5 17h-11a5 5 0 0 1 0-10zm0 2.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zm11 0a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"/>',
 msg:'<path d="M12 2C6.4 2 2 6.1 2 11.2c0 2.9 1.4 5.5 3.7 7.2V22l3.4-1.9c.9.3 1.9.4 2.9.4 5.6 0 10-4.1 10-9.3S17.6 2 12 2zm1 12.5-2.6-2.7-5 2.7 5.5-5.8 2.6 2.7 4.9-2.7-5.4 5.8z"/>',
 check:'<path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/>',
 bolt:'<path d="M7 2v11h3v9l7-12h-4l4-8z"/>',
 moon:'<path d="M12 3a9 9 0 1 0 9 9c0-.5 0-1-.1-1.4A5.5 5.5 0 0 1 13.4 3.1 9 9 0 0 0 12 3z"/>',
 arrow:'<path d="M12 4l-1.4 1.4 5.6 5.6H4v2h12.2l-5.6 5.6L12 20l8-8z"/>',
};

 <path class="sweat" d="M214 30c8 12 12 18 12 24a12 12 0 0 1-24 0c0-6 4-12 12-24z" fill="#9BD1FF" opacity="0"/>

 d.style.fontSize=(center?(PORT?104:120):L.hlF)+'px';

 return d;

function fitHL(d,maxW){let f=parseFloat(d.style.fontSize);while(d.scrollWidth>maxW&&f>40){f-=2;d.style.fontSize=f+'px'}
 if(d._center){d.style.left=(W-d.offsetWidth)/2+'px';d.style.textAlign='center'}else{d.style.left=L.hlX+'px';d.style.top=L.hlY+'px'}}
function animHL(d,t,tin,tout){d._words.forEach((w,i)=>{const a=P(t,tin+i*.07,.55,'outExpo');const b=P(t,tout+i*.04,.3,'in3');
 w.style.transform=`translateY(${(1-a)*115-b*115}%) rotate(${(1-a)*6}deg)`;})}

el('div','bg',null,s1,'background:radial-gradient(circle at 50% 50%,rgba(47,107,255,.25),transparent 55%)');

 ['chat','#8B5CF6','Live chat','Hi, anyone there?'],['sms','#0EA5E9','SMS','Can I reschedule?'],['insta','#E1306C','Instagram DM','Do you ship to UK?'],
 ['msg','#0084FF','Messenger','Price for 50 seats?'],['vm','#64748B','Voicemail','0:42 · new'],['phone','#FF4757','Missed call','3 attempts'],['wa','#25D366','WhatsApp','Refund status?']];
const chips=CH.map(([i,c,b,s],k)=>{const e=el('div','chip',`${ic(i,c)}<div><b>${b}</b><span>${s}</span></div>`,s2);
 const a=-Math.PI/2+k/CH.length*Math.PI*2+ (rnd()-.5)*.35;
 const rx=PORT?W*0.36:W*0.37, ry=PORT?H*0.33:H*0.37;
 e._tx=W/2+Math.cos(a)*rx*(0.9+rnd()*.2); e._ty=H/2+Math.sin(a)*ry*(0.9+rnd()*.25); e._r=(rnd()-.5)*16; e._d=k*.06; e._a=a; return e});

c5.innerHTML=`<div style="position:absolute;left:44px;top:44px"><div class="lbl">Predictive Dialer</div><div style="font-size:42px;font-weight:800;letter-spacing:-.02em">Renewals campaign</div></div>
 <svg width="300" height="300" style="position:absolute;left:44px;top:170px" viewBox="0 0 300 300"><circle cx="150" cy="150" r="120" stroke="#EEF1F6" stroke-width="30" fill="none"/>
 <circle class="ring" cx="150" cy="150" r="120" stroke="url(#gr)" stroke-width="30" fill="none" stroke-linecap="round" transform="rotate(-90 150 150)" stroke-dasharray="754" stroke-dashoffset="754"/>
 <defs><linearGradient id="gr"><stop offset="0" stop-color="#2F6BFF"/><stop offset="1" stop-color="#7C9CFF"/></linearGradient></defs></svg>
