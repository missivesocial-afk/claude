<!doctype html>

<style>

html,body{background:#000;overflow:hidden}

#stage{position:relative;overflow:hidden;background:var(--bg)}
.scene{position:absolute;inset:0;display:none}
.a{position:absolute}
.c{position:absolute;left:0;top:0}
.mono{font-family:Mono;letter-spacing:.02em}
.hl{position:absolute;font-family:Anton;text-transform:uppercase;line-height:.96;white-space:nowrap;letter-spacing:.005em}

.hl .w{display:inline-block;will-change:transform}
.hl .lime{color:var(--lime)} .hl .red{color:var(--red)}
.vis{position:absolute;width:900px;height:900px;transform-origin:50% 50%}
.win{position:absolute;width:500px;height:330px;background:var(--panel);border:2px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 30px 60px -20px rgba(0,0,0,.8)}
.win .tb{height:46px;border-bottom:2px solid var(--line);display:flex;align-items:center;gap:9px;padding:0 16px;font-family:Mono;font-size:20px;color:#A9A9B0}
.win .tb i{width:12px;height:12px;border-radius:50%;background:#3A3A42;display:block}
.bar{position:absolute;height:14px;border-radius:7px;background:#2A2A31}
.tile{position:absolute;width:280px;height:250px;background:var(--panel);border:2px solid var(--line);border-radius:14px;overflow:hidden}
.tile .k{position:absolute;left:18px;top:14px;font-family:Mono;font-size:19px;color:#8A8A92}
.tile .v{position:absolute;left:18px;bottom:14px;font-family:Anton;font-size:64px}
.chip{position:absolute;font-family:Mono;font-size:24px;color:var(--lime);border:2px solid var(--lime);border-radius:999px;padding:8px 20px;white-space:nowrap}
.node{position:absolute;border:3px solid var(--line);background:var(--panel);border-radius:18px;display:flex;align-items:center;justify-content:center;font-family:Mono;font-size:24px;color:#A9A9B0;text-align:center}
.pill{display:inline-flex;align-items:center;gap:10px;border-radius:999px;font-family:Mono;white-space:nowrap}
#grain{position:absolute;inset:-100px;pointer-events:none;opacity:.07;mix-blend-mode:screen}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.55))}

 if(t<LAP0)return [0,-1];let acc=0;for(let i=0;i<6;i++){const a=lapStart[i],d=LAPS[i];if(t<a+d)return [i+(t-a)/d,i]}return [6+(t-LAPEND)/.5,6]}

const vig=el('div',null,null,stage);vig.id='vig';
const flash=el('div','scene',null,stage,'background:#fff');

const HL=[[h2a,L[0],D[0]],[h2b,L[1],D[1]],[h2c,L[2],D[2]],[hLoop,TT.loopVO,DUR.loop],[hFrz,TT.frzVO,DUR.freeze],[hFix,TT.fixVO,DUR.fix],[e8,L[12],D[12]],[e9,L[13],D[13]]];
function prep(){HL.forEach(([h,s,d])=>{const sc=h.closest('.scene');sc.style.display='block';fit(h);place(h);sc.style.display='none';wordTimes(h,s,d)})}

// ---------------- RENDER ----------------
const show=(s,a,b,t)=>{s.style.display=(t>=a&&t<b)?'block':'none';return t>=a&&t<b};
function render(t){
 // grain jitter
 gcv.style.transform=`translate(${Math.floor(hash(Math.floor(t*30))*100)}px,${Math.floor(hash(Math.floor(t*30)+.5)*100)}px)`;
 const DROP=3.55;
 // ---- S1
 if(show(s1,0,L[0],t)){
  const ty=PORT?cy-80:cy-60;
  const k=cl(t/DROP);const secs=t<DROP?892*(Math.pow(k,2.6)):892;
  timer.textContent=mmss(secs);const dead=t>=DROP;
  timer.style.color=dead?'var(--red)':'var(--ink)';
  const gl=dead?(hash(Math.floor(t*40))-.5)*18*(1-P(t,DROP+.35,.3)):0;
  timer.style.textShadow=dead?`${gl}px 0 rgba(255,46,85,.7),${-gl}px 0 rgba(0,200,255,.5)`:'none';
  T(timer,cx+gl,ty,1*(1+.03*P(t,DROP,.08)*(1-P(t,DROP+.08,.3))),0,P(t,0,.25));
  hold.querySelector('.lab').textContent=dead?'CALL DROPPED':'ON HOLD';hold.style.color=dead?'var(--red)':'#BDBDC4';
  hold.querySelector('.dot').style.opacity=dead?1:(Math.sin(t*6)>0?1:.2);
  T(hold,cx,ty-(PORT?220:230),1,0,P(t,.05,.3));
  // hold waveform
  const ww=PORT?900:1200;let d='';const amp=dead?0:(38+14*Math.sin(t*3));
  for(let x=0;x<=ww;x+=6){const y=110+amp*Math.sin(x*.035+t*9)*Math.sin(x*.004+t*1.3)*(1-Math.pow(Math.abs(x-ww/2)/(ww/2),2));d+=(x?'L':'M')+x+' '+y.toFixed(1)}
  wpath.setAttribute('d',d);wpath.setAttribute('stroke',dead?'#FF2E55':'#F26422');T(wave,cx,ty+(PORT?230:220),1,0,P(t,.1,.4));
  // IVR caption synced to voice (starts TM.ivr)
  const spans=cap1.children;for(let i=0;i<spans.length;i++){const wt=TM.ivr+i*(2.95/IVRW.length);spans[i].style.opacity=t>wt?1:.18}
  T(cap1,cx,ty+(PORT?460:420),1,0,P(t,.2,.3)*(dead?.35:1));
  T(caller,cx,ty+(PORT?600:.0)+(PORT?0:520),1,0,P(t,1.2,.3)*(dead?0:1));
 }
 red1.style.display=(t>=DROP&&t<DROP+.12)?'block':'none';
 // ---- S2a
 if(show(s2a,L[0]-.05,L[1]-.02,t)){animHL(h2a,t,L[1]-.2);
  dots.forEach(d=>{d.style.transform='none';d.style.opacity=1;d.style.background='var(--lime)'});
  let n=0;drops.forEach((idx,j)=>{const tj=L[0]+.25+j*(D[0]-.1)/drops.length;const d=dots[idx];if(t>tj){n++;const k=P(t,tj,.5,'in3');d.style.background='var(--red)';d.style.transform=`translateY(${k*260}px) scale(${1-k*.5})`;d.style.opacity=1-k}});
  abd.querySelector('.n').textContent=n;
  v2a.style.opacity=P(t,L[0],.3);
 }
 // ---- S2b
 if(show(s2b,L[1]-.05,L[2]-.02,t)){animHL(h2b,t,L[2]-.2);
  const cyc=Math.max(0,Math.floor((t-L[1])/.22));let top=0;
  wins.forEach((w,i)=>{const a=P(t,L[1]+i*.12,.35,'outBack');const shake=(hash(i+cyc*7)-.5)*14;
   w.style.transform=`translate(${w._x-250+shake}px,${w._y-165}px) rotate(${w._r}deg) scale(${a})`;w.style.opacity=a>0?1:0;
   const foc=(cyc%6)==i&&t>L[1]+.7;w.style.zIndex=foc?20:i;w.style.borderColor=foc?'#F26422':'#2A2A30'});
  const fi=wins[(cyc%6)];const cxp=fi._x+60,cyp=fi._y-120;const pk=((t-L[1])%.22)/.22;
  cursor.style.transform=`translate(${cxp+(1-E.outExpo(pk))*80}px,${cyp+(1-E.outExpo(pk))*40}px)`;cursor.style.opacity=t>L[1]+.7?1:0;
  tabs.innerHTML=`ALT+TAB × <span style="color:var(--red)">${Math.max(0,cyc-2)}</span>`;
 }
 // ---- S2c
 if(show(s2c,L[2]-.05,L[2]+D[2]+.05,t)){animHL(h2c,t,L[2]+D[2]-.2);
  tiles.forEach((tl,i)=>{const a=P(t,L[2]+i*.05,.3);tl.style.opacity=a;
   const off=t>L[2]+.9+i*.11;const g=tl._cv;
   if(!off){const im=g.createImageData(140,125);for(let p=0;p<im.data.length;p+=4){const v=Math.random()*200;im.data[p]=im.data[p+1]=im.data[p+2]=v;im.data[p+3]=255}g.putImageData(im,0,0)}else{g.fillStyle='#08080A';g.fillRect(0,0,140,125)}
   tl.querySelector('.ns').style.opacity=off?(Math.sin(t*14+i)>-.3?1:0):0;tl.style.borderColor=off?'#3a1414':'#2A2A30'});
 }
 // ---- LOOP
 const B0=L[3]-.25,B1=L[4]-.12;
 if(show(sL,L[2]+D[2]+.05,B0,t)){
  animHL(hLoop,t,TT.frz-.3);
  const tf=Math.min(t,TT.frz);const [ph,li,heat]=drawLoop(tf);
  const sh=t<TT.frz?heat*heat*16:0;const shx=(hash(Math.floor(t*30))-.5)*sh,shy=(hash(Math.floor(t*30)+3)-.5)*sh;
  const ca=P(t,L[2]+D[2]+.05,.5,'outExpo');
  T(lcv,LP.x+shx,LP.y+shy,(.8+.2*ca)*(1+.035*heat*Math.sin(t*22)),0,ca);
  ST.forEach(([n,a],i)=>{const r=a*Math.PI/180;const d=LP.r+(i%2?(PORT?95:120):62);T(stl[i],LP.x+Math.cos(r)*d+shx,LP.y+Math.sin(r)*d+shy,1,0,ca*(1-P(t,TT.frz,.3)*.6))});
  lapLbl.textContent=li>=0&&li<6?'LAP '+(li+1):'';T(lapLbl,LP.x+shx,LP.y+shy,1+.1*P(t,lapStart[Math.max(0,li)]||0,.15)*(1-P(t,(lapStart[Math.max(0,li)]||0)+.15,.2)),0,t<TT.frz&&t>=LAP0?1:0);
  const fz=P(t,TT.frz,.25);sL.style.filter=fz>0?`grayscale(${fz*.9}) brightness(${1-fz*.55})`:'none';
  red1.style.display=(t<TT.frz&&li>=3&&(t-lapStart[li])<.07)?'block':red1.style.display;
 }
 if(show(sQ,TT.frz,B0,t)){animHL(hFrz,t,B0-.18)}
 // ---- damage list (shared by loop + fix)
 const lOn=t>=LAP0&&t<L[12]-.12&&!(t>=TT.frz+.2&&t<B1);listBox.style.display=lOn?'block':'none';
 if(lOn){items.forEach((e,i)=>{const ta=lapStart[i]+LAPS[i]*.3;const a=P(t,ta,.3,'outBack');e.style.opacity=t>ta?1:0;
  const latest=(i===items.filter((_,j)=>t>lapStart[j]+LAPS[j]*.3).length-1);
  const tf=TT.flip0+i*.55;const st=P(t,tf,.16),fl=P(t,tf+.16,.3,'outExpo');
  const o=e.querySelector('.o'),n=e.querySelector('.n'),s=e.querySelector('.st');
  s.style.width=(st*o.offsetWidth)+'px';s.style.opacity=1-fl;o.style.opacity=1-fl;n.style.opacity=fl;
  n.style.transform=`translateY(${(1-fl)*30}px)`;o.style.color=t<TT.frz?(latest?'var(--red)':'rgba(242,240,234,.55)'):(t<B0?'rgba(242,240,234,.4)':'rgba(242,240,234,.6)');
  e.style.transform=`scale(${a*(latest&&t<TT.frz?1+.06*Math.sin(t*18):1)})`;});}
 // ---- S3 brand (unchanged from v3)
 if(show(s3,B0,B1,t)){
  const ey=PORT?cy+300:cy+340;const k=cl((t-B0)/1.2);let d='';
  for(let x=0;x<=W;x+=4){const px=x/W;const head=k*1.25;let y=200;const dd=px-head+.15;
   if(px<head){if(Math.abs(dd)<.05){const u=dd/.05;y=200-Math.exp(-u*u*6)*170*Math.cos(u*3)}else y=200+Math.sin(x*.02)*2}
   d+=(x?'L':'M')+x+' '+y.toFixed(1)}
  ecgp.setAttribute('d',d);T(ecg,cx,ey);
  T(meet,cx,(PORT?cy-230:cy-240)+(1-P(t,B0+.05,.35,'outExpo'))*30,1,0,P(t,B0+.05,.25));
  const b=P(t,B0+.12,.45,'outExpo');T(brand,cx,PORT?cy-70:cy-70,mix(1.25,1,b),0,b);
  T(by,cx,PORT?cy+110:cy+120,1,0,P(t,B0+.45,.35));
 }
 // ---- FIX
 if(show(sF,B1,L[12]-.12,t)){animHL(hFix,t,L[12]-.35);drawFix(t)}
 // ---- END
 if(show(s5,L[12]-.12,99,t)){const s=L[12];const endT=L[13]+.75;const ec=P(t,endT,.45,'outExpo');
  const ty=PORT?cy+140:cy+190;
  const rw=P(t,s,1.0,'inOut');timer5.textContent=mmss(892*(1-rw));const conn=rw>=1;
  timer5.style.color=conn?'var(--lime)':'var(--ink)';
  hold5.innerHTML=conn?'<span style="color:var(--lime)">● CONNECTED</span>':'<span style="color:#BDBDC4">◀◀ REWINDING HOLD TIME</span>';
  T(timer5,cx,mix(ty,PORT?cy-560:cy-330,ec),mix(1,.42,ec),0,P(t,s-.1,.2));
  T(hold5,cx,mix(ty-(PORT?200:180),PORT?cy-680:cy-420,ec),mix(1,.8,ec),0,P(t,s-.1,.2));
  animHL(e8,t,L[13]-.18);animHL(e9,t,endT-.05);
  const lg=P(t,endT+.25,.55,'outExpo');T(logo,cx,(PORT?cy-110:cy-120)+(1-lg)*50,1,0,lg);
  T(sub5,cx,PORT?cy+10:cy-10,1,0,P(t,endT+.4,.4));
  const ca=P(t,endT+.5,.5,'outBack');T(cta,cx,PORT?cy+190:cy+140,ca*(1+.025*Math.sin((t-endT)*5)*(t>endT+1)));
  T(url,cx,PORT?cy+330:cy+270,1,0,P(t,endT+.7,.4));
 }
 flash.style.display=(t>=B0&&t<B0+.1)?'block':'none';flash.style.opacity=.85;
}

window.render=render;
window.ready=Promise.all([document.fonts.load('150px Anton'),document.fonts.load('700 30px Inter'),document.fonts.load('30px Mono')]).then(()=>document.fonts.ready).then(()=>{prep();render(0);return true});
</script></body></html>
